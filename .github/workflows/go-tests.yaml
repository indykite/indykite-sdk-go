---
name: Tests
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["dev", "develop", "main", "master"]
  # Run on default branch for cache generation & to report coverage on master branch to Codecov
  push:
    branches: ["dev", "develop", "main", "master"]
  # to have an ability to run thee workflow manually
  workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  INDYKITE_APPLICATION_CREDENTIALS: ${{ secrets.INDYKITE_APPLICATION_CREDENTIALS }}
  INDYKITE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.INDYKITE_SERVICE_ACCOUNT_CREDENTIALS }}
  # CUSTOMER_ID is the organization gid, LOCATION_ID is the project (app space)
  # gid, and PROJECT_ID is the GCP project hosting the BigQuery audit table.
  ORGANIZATION_ID: ${{ secrets.CUSTOMER_ID }}
  PROJECT_ID: ${{ secrets.REST_LOCATION_ID }}
  BQ_PROJECT_ID: ${{ secrets.PROJECT_ID }}
  SDK_AUDIT_TABLE_NAME: ${{ secrets.SDK_AUDIT_TABLE_NAME }}

#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# "all of those that are not specified are set to none."
permissions:
  contents: read # work with the contents of the repository
#
jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 - https://github.com/actions/setup-go/releases
        with:
          go-version-file: go.mod

      - name: Run Unit tests
        run: |
          make test

      - name: codecov/upload-coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0 - https://github.com/codecov/codecov-action/releases
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          # Notify us when failed, so devs are not waiting for Codecov report when it will never come.
          # Because Codecov report is required to be able to merge, we have to run again the whole test anyway.
          fail_ci_if_error: true

  integration-test:
    name: Integration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.pull_request && github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID_MGMT: ${{ secrets.GCP_PROJECT_ID_MGMT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT }}
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 - https://github.com/actions/setup-go/releases
        with:
          go-version-file: go.mod

      - name: gcloud/auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 - https://github.com/google-github-actions/auth/releases
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER_MGMT }}
          service_account: github@${{ env.GCP_PROJECT_ID_MGMT }}.iam.gserviceaccount.com

      - name: Provision integration fixtures
        run: |
          # The runtime credential is a bare token with no URL; take the base
          # URL from the service-account artifact.
          INDYKITE_BASE_URL=$(jq -r .baseUrl <<< "$INDYKITE_SERVICE_ACCOUNT_CREDENTIALS")
          export INDYKITE_BASE_URL
          # apply is idempotent (create-if-missing by name, upserts by external
          # id) and prints shell-quoted `export KEY="value"` lines for the
          # fixture env (CIQ_QUERY_ID, EM_PIPELINE_ID, AUTHZEN_*, CIQ_INPUT_PARAMS).
          # eval them so values containing quotes (the CIQ_INPUT_PARAMS JSON) are
          # decoded correctly, then forward each resolved value to GITHUB_ENV
          # verbatim — GITHUB_ENV takes the value literally, so it must not carry
          # the shell escaping.
          fixtures=$(go run ./test/setup apply)
          eval "$(grep '^export ' <<< "$fixtures")"
          {
            echo "INDYKITE_BASE_URL=$INDYKITE_BASE_URL"
            grep -oE '^export [A-Z_]+' <<< "$fixtures" | awk '{print $2}' | while read -r key; do
              printf '%s=%s\n' "$key" "${!key}"
            done
          } >> "$GITHUB_ENV"

      - name: Run Integration tests
        run: |-
          make integration
